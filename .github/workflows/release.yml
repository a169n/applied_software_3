# Continuous delivery: pushing a version tag such as v0.1.0 runs the tests,
# builds the package and publishes it as a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Verify the tag matches the package version
        run: |
          version=$(python -c "import climate_analyzer; print(climate_analyzer.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          }
      - run: pytest
      - run: python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
